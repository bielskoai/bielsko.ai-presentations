[build]
publish = "dist"
command = "npm run build"

[build.environment]
NODE_VERSION = "20"
# Który deck jest publikowany pod główną domeną (decks/<DECK>/slides.md).
DECK = "001"

[[redirects]]
from = "/.well-known/*"
to = "/.well-known/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
